# Offline suite on Linux and Windows, then the real-browser replica suite with the installed
# Chrome. The replica answers every request inside the browser and the test browser's proxy is
# a dead local port, so no publisher or other site is contacted and no secrets are used.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  browser:
    name: browser / ${{ matrix.os }} / ${{ matrix.driver }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            driver: playwright
          - os: windows-latest
            driver: patchright
          - os: ubuntu-latest
            driver: playwright
    env:
      PA_BROWSER_CHANNEL: chrome
      PA_BROWSER_DRIVER: ${{ matrix.driver }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install (drivers pinned for reproducible runs)
        run: python -m pip install -e ".[test]" playwright==1.64.1 patchright==1.64.2
      - name: Replica suite (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest tests/test_browser_replica.py -v -rA --durations=0 -o faulthandler_timeout=180
      - name: Replica suite (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)
          xvfb-run -a -s "-screen 0 1600x1000x24" python -m pytest tests/test_browser_replica.py -v -rA --durations=0 -o faulthandler_timeout=180
